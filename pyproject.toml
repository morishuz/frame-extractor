[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-extractor"
version = "0.1.0"
description = "CLI for extracting SfM-friendly keyframes from video with dense DIS optical flow"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "M. Seeger"},
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.11",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
frame-extractor = "frame_extractor.cli:main"

[project.urls]
Homepage = "https://github.com/morishuz/frame-extractor"
Repository = "https://github.com/morishuz/frame-extractor"
Issues = "https://github.com/morishuz/frame-extractor/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pytest>=8.0",
]
